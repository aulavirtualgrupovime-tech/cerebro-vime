<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validación de constancias · Aula Virtual Grupo VIME</title>
  <meta name="theme-color" content="#0C3B6F">
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/icono-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <style>
    :root { --marino: #0C3B6F; --naranja: #F05A22; --verde: #2E7D5B; --rojo: #B3261E; --gris: #5E6B7A; --claro: #EEF2F6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Montserrat, system-ui, sans-serif; color: #1E2A38; background: linear-gradient(180deg, var(--marino) 0 210px, var(--claro) 210px); min-height: 100vh; }
    .caja { max-width: 560px; margin: 0 auto; padding: 28px 18px 40px; }
    .logos { display: flex; justify-content: center; align-items: center; gap: 22px; background: #fff; border-radius: 16px 16px 0 0; padding: 18px; border-bottom: 4px solid var(--naranja); }
    .logos img { height: 58px; width: auto; }
    .tarjeta { background: #fff; border-radius: 0 0 16px 16px; padding: 24px 22px; box-shadow: 0 10px 30px rgba(12, 59, 111, .15); }
    h1 { font-size: 19px; margin: 0 0 4px; color: var(--marino); text-align: center; letter-spacing: .02em; }
    .sub { color: var(--gris); font-size: 13px; text-align: center; margin: 0 0 18px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; font: inherit; font-size: 16px; padding: 11px 12px; border: 1.5px solid #CBD5E1; border-radius: 10px; text-transform: uppercase; }
    button { font: inherit; font-weight: 600; background: var(--marino); color: #fff; border: 0; border-radius: 10px; padding: 0 18px; cursor: pointer; }
    .res { margin-top: 20px; border-radius: 12px; padding: 18px; }
    .ok { background: #E6F3EC; border: 1.5px solid var(--verde); }
    .mal { background: #FDECEA; border: 1.5px solid var(--rojo); }
    .espera { background: var(--claro); text-align: center; color: var(--gris); }
    .sello { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-bottom: 12px; }
    .ok .sello { color: var(--verde); } .mal .sello { color: var(--rojo); }
    .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 17px; flex: none; }
    .ok .ico { background: var(--verde); } .mal .ico { background: var(--rojo); }
    dl { margin: 0; display: grid; grid-template-columns: 112px 1fr; gap: 8px 12px; font-size: 14px; }
    dt { color: var(--gris); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
    dd { margin: 0; font-weight: 500; }
    .nombre { font-size: 17px; font-weight: 700; color: var(--marino); }
    .pie { text-align: center; font-size: 12px; color: var(--gris); margin-top: 18px; line-height: 1.5; }
    .pie a { color: var(--marino); }
  </style>
</head>
<body>
  <div class="caja">
    <div class="logos"><img src="img/logo_aula_rec.png" alt="Aula Virtual Grupo VIME"><img src="img/logo_gv.png" alt="Grupo VIME"></div>
    <div class="tarjeta">
      <h1>VALIDACIÓN DE CONSTANCIAS</h1>
      <p class="sub">Escriba el folio impreso en la constancia o escanee su código QR.</p>
      <form id="f"><input id="folio" placeholder="AV.PCO2026-001" autocomplete="off" spellcheck="false" aria-label="Folio"><button>Validar</button></form>
      <div id="res"></div>
      <p class="pie">Este registro lo lleva Aula Virtual Grupo VIME · Grupo VIME Asesoría Corporativa Integral.<br>Por privacidad no se muestran datos personales distintos del nombre.<br><a href="https://www.aulavirtualgrupovime.com" target="_blank" rel="noopener">www.aulavirtualgrupovime.com</a></p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script>
    (() => {
      const $ = s => document.querySelector(s);
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const fecha = iso => { if (!iso) return ''; const [a, m, d] = iso.split('-').map(Number); return d + ' de ' + MESES[m - 1] + ' de ' + a; };

      async function buscar(folio) {
        // Versión de prueba (abierta desde el disco): busca en los datos ficticios de este navegador
        if (!CONFIG.SERVIDOR_URL) {
          let db = {}; try { db = JSON.parse(localStorage.getItem('cerebro_vime_demo_v6') || '{}'); } catch (e) { }
          const r = (db.constancias || []).find(x => x.folio === folio);
          return r ? { encontrado: true, folio: r.folio, nombre: r.nombre, curso: r.curso, modalidad: r.modalidad, fechas: r.fechasTexto, horas: r.horas, instructor: r.instructor, emitida: String(r.emitida || '').slice(0, 10), estado: r.estado, prueba: true } : { encontrado: false, folio };
        }
        const r = await fetch(CONFIG.SERVIDOR_URL + '?folio=' + encodeURIComponent(folio));
        return r.json();
      }
      async function validar(folio) {
        folio = String(folio || '').trim().toUpperCase().replace(/\s+/g, '');
        if (!folio) return;
        $('#folio').value = folio;
        history.replaceState(null, '', location.pathname + '?f=' + encodeURIComponent(folio));
        $('#res').innerHTML = '<div class="res espera">Consultando el registro…</div>';
        try {
          const j = await buscar(folio);
          if (!j.encontrado) {
            $('#res').innerHTML = '<div class="res mal"><div class="sello"><span class="ico">✕</span>Folio no registrado</div><p style="margin:0;font-size:14px">No existe una constancia con el folio <b>' + esc(folio) + '</b> en el registro de Aula Virtual Grupo VIME. Revise que esté bien escrito; si el problema continúa, la constancia no fue emitida por nosotros.</p></div>';
            return;
          }
          const cancelada = j.estado === 'cancelada';
          $('#res').innerHTML = '<div class="res ' + (cancelada ? 'mal' : 'ok') + '"><div class="sello"><span class="ico">' + (cancelada ? '!' : '✓') + '</span>' +
            (cancelada ? 'Constancia CANCELADA' : 'Constancia auténtica y vigente') + (j.prueba ? ' (prueba)' : '') + '</div><dl>' +
            '<dt>Otorgada a</dt><dd class="nombre">' + esc(j.nombre) + '</dd>' +
            '<dt>Curso</dt><dd>' + esc(j.curso) + '</dd>' +
            (j.modalidad ? '<dt>Modalidad</dt><dd>' + esc(j.modalidad) + '</dd>' : '') +
            '<dt>Fechas</dt><dd>' + esc(j.fechas) + '</dd>' +
            (j.horas ? '<dt>Duración</dt><dd>' + esc(j.horas) + ' horas</dd>' : '') +
            (j.instructor ? '<dt>Capacitador</dt><dd>' + esc(j.instructor) + '</dd>' : '') +
            '<dt>Folio</dt><dd>' + esc(j.folio) + '</dd>' +
            '<dt>Emitida</dt><dd>' + esc(fecha(j.emitida)) + '</dd></dl>' +
            (cancelada ? '<p style="margin:12px 0 0;font-size:13px">Esta constancia fue cancelada por el emisor y ya no tiene validez.</p>' : '') + '</div>';
        } catch (e) {
          $('#res').innerHTML = '<div class="res mal"><div class="sello"><span class="ico">!</span>Sin conexión con el registro</div><p style="margin:0;font-size:14px">Intente de nuevo en unos minutos.</p></div>';
        }
      }
      $('#f').addEventListener('submit', e => { e.preventDefault(); validar($('#folio').value); });
      const q = new URLSearchParams(location.search).get('f') || (location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : '');
      if (q) validar(q);
    })();
  </script>
</body>
</html>
