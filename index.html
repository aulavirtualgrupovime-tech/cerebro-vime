<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cerebro Grupo VIME</title>
  <meta name="theme-color" content="#0C3B6F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icono-192.png">
  <link rel="apple-touch-icon" href="img/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div id="franjaPrueba" class="franja-prueba" hidden></div>

  <div class="marco">
    <aside class="lateral" id="lateral">
      <div class="marca">
        <img src="img/logo_gv.png" alt="Grupo VIME" class="marca-logo">
        <div class="marca-app">CEREBRO</div>
      </div>
      <nav class="menu" id="menu">
        <a href="#/panel" data-ruta="panel"><span class="ico">◧</span><span>Panel</span></a>
        <a href="#/clientes" data-ruta="clientes"><span class="ico">▤</span><span>Clientes</span></a>
        <a href="#/calendario" data-ruta="calendario"><span class="ico">▦</span><span>Calendario</span></a>
        <a href="#/capacitaciones" data-ruta="capacitaciones"><span class="ico">✎</span><span>Capacitaciones</span></a>
        <a href="#/avisos" data-ruta="avisos"><span class="ico">◉</span><span>Avisos</span><b class="burbuja" id="burbujaAvisos" hidden></b></a>
        <a href="#/pagos" data-ruta="pagos" id="menuPagos" hidden><span class="ico">$</span><span>Pagos</span></a>
        <a href="#/ajustes" data-ruta="ajustes"><span class="ico">⚙</span><span>Ajustes</span></a>
      </nav>
      <div class="lateral-pie">
        <img src="img/logo_aula_rec.png" alt="Aula Virtual Grupo VIME" class="logo-aula">
      </div>
    </aside>

    <div class="cuerpo">
      <header class="barra">
        <div class="barra-titulo" id="titulo">Panel</div>
        <div class="barra-der">
          <span class="estado-sinc" id="estadoSinc"></span>
          <button class="btn-icono" data-acc="recargar" title="Actualizar">⟳</button>
          <div class="usuario" id="usuarioCaja"></div>
        </div>
      </header>
      <main id="principal" class="principal"></main>
    </div>
  </div>

  <div id="capaModal" class="capa" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-cab"><h3 id="modalTitulo"></h3><button class="btn-icono" data-acc="cerrarModal" aria-label="Cerrar">✕</button></div>
      <div class="modal-cuerpo" id="modalCuerpo"></div>
    </div>
  </div>
  <div id="aviso" class="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/logica.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/importar.js"></script>
  <script src="js/logos_fijos.js"></script>
  <script src="js/documentos.js"></script>
  <script src="js/constancias.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
